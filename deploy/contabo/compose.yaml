name: admira-control-plane

x-control-common: &control-common
  image: ${CONTROL_IMAGE:-admira-control-plane:r1}
  restart: unless-stopped
  init: true
  user: "${ADMIRA_SERVICE_UID:-1001}:${ADMIRA_SERVICE_GID:-1001}"
  read_only: true
  depends_on:
    postgres:
      condition: service_healthy
  environment: &control-environment
    ADMIRA_DB_HOST: postgres
    ADMIRA_DB_PORT: "5432"
    ADMIRA_DB_NAME: ${POSTGRES_DB:-admira_control}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  pids_limit: 96
  mem_limit: ${CONTROL_SERVICE_MEMORY_LIMIT:-256m}
  cpus: ${CONTROL_SERVICE_CPU_LIMIT:-0.50}
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    depends_on:
      postgres-secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admira_control}
      POSTGRES_USER: ${POSTGRES_USER:-admira_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - ingress_db_password
      - runtime_db_password
      - delivery_db_password
      - scheduler_db_password
      - provisioner_db_password
      - image_db_password
      - recovery_db_password
      - email_delivery_db_password
      - operator_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_auth:/run/admira-db-secrets:ro
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - control_private
      - operator_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: 1.0

  # File-backed Compose secrets keep host ownership/mode. Stage the service
  # role passwords into a PostgreSQL-owned private volume so the server-side
  # pg_read_file() calls never require making host secrets world-readable.
  postgres-secrets-init:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -d -m 0700 -o 999 -g 999 /postgres-auth;
        for secret_name in ingress_db_password runtime_db_password delivery_db_password scheduler_db_password provisioner_db_password image_db_password recovery_db_password email_delivery_db_password operator_db_password;
        do install -m 0400 -o 999 -g 999 "/run/secrets/$${secret_name}" "/postgres-auth/$${secret_name}"; done
    secrets:
      - ingress_db_password
      - runtime_db_password
      - delivery_db_password
      - scheduler_db_password
      - provisioner_db_password
      - image_db_password
      - recovery_db_password
      - email_delivery_db_password
      - operator_db_password
    volumes:
      - postgres_auth:/postgres-auth
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.1

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-bookworm}
    restart: unless-stopped
    user: "999:999"
    depends_on:
      redis-init:
        condition: service_completed_successfully
    command: ["redis-server", "--aclfile", "/run/redis-auth/redis_users.acl", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
      - redis_auth:/run/redis-auth:ro
    networks:
      - control_private
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^user default on >\\([^ ]*\\).*/\\1/p' /run/redis-auth/redis_users.acl)\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 128
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: 0.5

  # Docker secrets are mounted read-only as root-owned files.  The official
  # Redis image drops to uid 999, so stage the ACL into a private named volume
  # once, then let Redis read that volume without root or extra capabilities.
  redis-init:
    image: ${REDIS_IMAGE:-redis:7.4-bookworm}
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -d -m 0700 -o 999 -g 999 /redis-auth /data;
        install -m 0400 -o 999 -g 999 /run/secrets/redis_users_acl /redis-auth/redis_users.acl;
        chown -R 999:999 /data
    secrets:
      - redis_users_acl
    volumes:
      - redis_auth:/redis-auth
      - redis_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.1

  # Dormant r91 service for Admira-sponsored image generation. It is in its
  # own profile and never starts with the buyer workers. The central Codex
  # credential pool is mounted only here and in the internal operator
  # dashboard; tenant runtimes receive only a scoped HMAC key, the Unix socket
  # and their own exchange directory.
  central-image-broker:
    profiles: ["central-images"]
    # There is no mutable/default central image. The operator must pin the
    # exact output of build-hosted-runtime.sh in .env before enabling this
    # dormant profile; r90 tenant runtimes remain the normal default.
    image: ${CENTRAL_IMAGE_IMAGE:-admira-ia-hosted:r91-canary-000000000000}
    restart: unless-stopped
    init: true
    # The broker's primary group is deliberately separate from the control
    # plane group. Tenant containers receive this GID explicitly when they
    # need to connect to the 0660 Unix socket; no DAC_OVERRIDE is required.
    user: "${ADMIRA_SERVICE_UID:-1001}:${ADMIRA_CENTRAL_IMAGE_GID:-19093}"
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python3", "/app/deploy/contabo/central_image_service.py"]
    environment:
      ADMIRA_DB_HOST: postgres
      ADMIRA_DB_PORT: "5432"
      ADMIRA_DB_NAME: ${POSTGRES_DB:-admira_control}
      ADMIRA_DB_USER: admira_image_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/image_db_password
      ADMIRA_CENTRAL_IMAGE_SOCKET: /run/admira-central-image-broker/broker.sock
      ADMIRA_CENTRAL_IMAGE_EXCHANGE_ROOT: /srv/admira-central-image-exchange
      ADMIRA_CENTRAL_IMAGE_KEY_ROOT: /etc/admira/central-image-keys
      ADMIRA_CENTRAL_IMAGE_MAX_GLOBAL: ${ADMIRA_CENTRAL_IMAGE_MAX_GLOBAL:-2}
      ADMIRA_CENTRAL_IMAGE_MAX_CLIENTS: ${ADMIRA_CENTRAL_IMAGE_MAX_CLIENTS:-32}
      # The broker receives a private, operator-managed pool. Each account
      # lives below this root; the service selects an account explicitly.
      ADMIRA_CENTRAL_CODEX_AUTH_ROOT: ${ADMIRA_CENTRAL_CODEX_AUTH_ROOT:-/app/runtime/hermes/codex-auth-pool}
      ADMIRA_CENTRAL_CODEX_ACCOUNT_IDS: ${ADMIRA_CENTRAL_CODEX_ACCOUNT_IDS:-primary,secondary}
      CODEX_HOME: /app/runtime/hermes/codex-auth-pool/primary
      PYTHONPATH: /app/src:/app/deploy/contabo
    secrets:
      - image_db_password
    volumes:
      - type: bind
        source: /run/admira-central-image-broker
        target: /run/admira-central-image-broker
      - type: bind
        source: /etc/admira/central-image-keys
        target: /etc/admira/central-image-keys
        read_only: true
      - type: bind
        source: /srv/admira/shared/central-image-exchange
        target: /srv/admira-central-image-exchange
      - type: bind
        source: /srv/admira/shared/central-codex-auth
        target: /app/runtime/hermes/codex-auth-pool
    networks:
      - control_private
      - image_provider_egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    pids_limit: 256
    mem_limit: ${CENTRAL_IMAGE_MEMORY_LIMIT:-1536m}
    cpus: ${CENTRAL_IMAGE_CPU_LIMIT:-2.0}
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Internal-only operator control surface. Reach it remotely through an SSH
  # tunnel; the hosted image supplies the Codex CLI for bounded device auth.
  operator-dashboard:
    profiles: ["operator-dashboard"]
    # This is the same immutable hosted canary selected for the dormant image
    # broker. It contains the pinned Codex CLI; preflight rejects mutable or
    # malformed CENTRAL_IMAGE_IMAGE values before operators enable the profile.
    image: ${CENTRAL_IMAGE_IMAGE:-admira-ia-hosted:r91-canary-000000000000}
    restart: unless-stopped
    init: true
    user: "${ADMIRA_SERVICE_UID:-1001}:${ADMIRA_SERVICE_GID:-1001}"
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python3", "/app/deploy/contabo/operator_dashboard.py"]
    environment:
      ADMIRA_DB_HOST: postgres
      ADMIRA_DB_PORT: "5432"
      ADMIRA_DB_NAME: ${POSTGRES_DB:-admira_control}
      ADMIRA_DB_USER: admira_operator_login
      ADMIRA_OPERATOR_DB_PASSWORD_FILE: /run/secrets/operator_db_password
      # The file is created exactly once by loopback-only first-run setup. The
      # enclosing host directory is private and persistent; no default
      # password or plaintext password secret exists.
      ADMIRA_OPERATOR_PASSWORD_FILE: /var/lib/admira/operator-password/password.hash
      ADMIRA_OPERATOR_BIND: 0.0.0.0
      ADMIRA_OPERATOR_PORT: "8791"
      # Plain HTTP is encrypted by the SSH tunnel. The Host/Origin allowlist
      # permits loopback names only, and the port is never publicly published.
      ADMIRA_OPERATOR_COOKIE_SECURE: "false"
      ADMIRA_OPERATOR_ALLOWED_HOSTS: "localhost,127.0.0.1,::1"
      # Docker may present a bridge gateway for tunnel requests. Pin only its
      # observed /32 (or /128) during setup; never trust forwarded headers.
      ADMIRA_OPERATOR_SETUP_CIDRS: "${ADMIRA_OPERATOR_SETUP_CIDRS:-127.0.0.1/32,::1/128}"
      ADMIRA_GEMINI_POOL_ROOT: /etc/admira/gemini-pool
      ADMIRA_CENTRAL_CODEX_AUTH_ROOT: /app/runtime/hermes/codex-auth-pool
      # This is a narrow authenticated Unix-socket capability, not Docker or
      # a tenant-root mount. The key signs only the allowlisted lifecycle
      # actions implemented by the host provisioner service.
      ADMIRA_PROVISIONER_SOCKET: /run/admira-tenant-provisioner/provisioner.sock
      # Keep the key outside the read-only socket-directory bind. Docker cannot
      # create a nested file mount below that read-only directory on all hosts.
      ADMIRA_PROVISIONER_KEY_FILE: /run/admira-tenant-provisioner.key
      PYTHONPATH: /app/deploy/contabo
    secrets:
      - operator_db_password
    volumes:
      - type: bind
        source: /run/admira-tenant-provisioner
        target: /run/admira-tenant-provisioner
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/admira/tenant-provisioner.key
        target: /run/admira-tenant-provisioner.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/admira/gemini-pool
        target: /etc/admira/gemini-pool
        bind:
          create_host_path: false
      - type: bind
        source: /srv/admira/shared/central-codex-auth
        target: /app/runtime/hermes/codex-auth-pool
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/operator-password
        target: /var/lib/admira/operator-password
        bind:
          create_host_path: false
    group_add:
      - "${ADMIRA_PROVISIONER_GID:-19094}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=${ADMIRA_SERVICE_UID:-1001},gid=${ADMIRA_SERVICE_GID:-1001}
    ports:
      - "127.0.0.1:${ADMIRA_OPERATOR_PORT:-8791}:8791"
    networks:
      - operator_private
      - operator_provider_egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${OPERATOR_SERVICE_MEMORY_LIMIT:-512m}
    cpus: ${OPERATOR_SERVICE_CPU_LIMIT:-1.0}
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Telegram network boundary. Only this process receives the shared token,
  # and it can only stage inbound media plus write to the durable inbox.
  telegram-poller:
    <<: *control-common
    profiles: ["buyers"]
    # Build the shared image exactly once. The remaining workers consume this
    # same tag and must not race while exporting parallel identical builds.
    build:
      context: .
      dockerfile: Control.Dockerfile
    command: ["poller"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_ingress_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/ingress_db_password
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ADMIRA_SPOOL_ROOT: /srv/admira-spool
      ADMIRA_TELEGRAM_RECOVERY_READY: "${ADMIRA_TELEGRAM_RECOVERY_READY:-false}"
      ADMIRA_RECOVERY_DB_USER: admira_recovery_login
      ADMIRA_RECOVERY_DB_PASSWORD_FILE: /run/secrets/recovery_db_password
      ADMIRA_RECOVERY_HMAC_KEY_FILE: /run/secrets/recovery_hmac_key
      ADMIRA_RECOVERY_DELIVERY_KEY_FILE: /run/secrets/recovery_delivery_key
      ADMIRA_RECOVERY_DELIVERY_KEY_VERSION: "${ADMIRA_RECOVERY_DELIVERY_KEY_VERSION:-v1}"
    secrets:
      - ingress_db_password
      - telegram_bot_token
      - recovery_db_password
      - recovery_hmac_key
      - recovery_delivery_key
    group_add:
      - "${ADMIRA_SPOOL_GID:-19092}"
    volumes:
      - type: bind
        source: /srv/admira/shared/telegram-spool/inbound
        target: /srv/admira-spool/inbound
    networks:
      - control_private
      - telegram_egress

  # This process owns durable turn dispatch but has neither Telegram's token
  # nor Docker access. The authenticated host broker exposes only narrow
  # tenant lifecycle and turn operations over a Unix socket.
  runtime-worker:
    <<: *control-common
    profiles: ["buyers"]
    # Compose scales only this non-token-owning worker. Keep the default at
    # one; operators may raise it to eight after capacity testing.
    scale: ${RUNTIME_WORKER_REPLICAS:-1}
    command: ["runtime"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_runtime_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/runtime_db_password
      ADMIRA_BROKER_SOCKET: /run/admira-runtime-broker/broker.sock
      ADMIRA_BROKER_KEY_FILE: /run/secrets/runtime_broker_key
      # Remains false until the central image broker passes its own canary.
      # `/conectar_chatgpt` then explains sponsorship without promising a
      # service that has not been activated yet.
      ADMIRA_CENTRAL_IMAGE_READY: "${ADMIRA_CENTRAL_IMAGE_READY:-false}"
    secrets:
      - runtime_db_password
      - runtime_broker_key
    group_add:
      - "${ADMIRA_BROKER_GID:-19091}"
    volumes:
      - type: bind
        source: /run/admira-runtime-broker
        target: /run/admira-runtime-broker
        read_only: true
    networks:
      - control_private

  # Delivery is the only other token holder. It can read only the outbound
  # spool and cannot reach the runtime broker or any tenant directory.
  telegram-delivery:
    <<: *control-common
    profiles: ["buyers"]
    command: ["delivery"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_delivery_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/delivery_db_password
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ADMIRA_SPOOL_ROOT: /srv/admira-spool
    secrets:
      - delivery_db_password
      - telegram_bot_token
    group_add:
      - "${ADMIRA_SPOOL_GID:-19092}"
    volumes:
      - type: bind
        source: /srv/admira/shared/telegram-spool/outbound
        target: /srv/admira-spool/outbound
    networks:
      - control_private
      - telegram_egress

  # Provider-neutral recovery email delivery. It stays outside the buyers
  # profile so recovery cannot be advertised before SMTP/domain canaries pass.
  recovery-email:
    <<: *control-common
    profiles: ["recovery-email"]
    command: ["recovery-email"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_email_delivery_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/email_delivery_db_password
      ADMIRA_RECOVERY_DELIVERY_KEY_FILE: /run/secrets/recovery_delivery_key
      ADMIRA_RECOVERY_DELIVERY_KEY_VERSION: "${ADMIRA_RECOVERY_DELIVERY_KEY_VERSION:-v1}"
      ADMIRA_SMTP_HOST: "${ADMIRA_SMTP_HOST:-}"
      ADMIRA_SMTP_PORT: "${ADMIRA_SMTP_PORT:-587}"
      ADMIRA_SMTP_SECURITY: "${ADMIRA_SMTP_SECURITY:-starttls}"
      ADMIRA_SMTP_FROM: "${ADMIRA_SMTP_FROM:-}"
      ADMIRA_SMTP_USERNAME_FILE: /run/secrets/smtp_username
      ADMIRA_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - email_delivery_db_password
      - recovery_delivery_key
      - smtp_username
      - smtp_password
    networks:
      - control_private
      - email_egress

  scheduler-worker:
    <<: *control-common
    profiles: ["buyers"]
    command: ["scheduler"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_scheduler_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/scheduler_db_password
      ADMIRA_BROKER_SOCKET: /run/admira-runtime-broker/broker.sock
      ADMIRA_BROKER_KEY_FILE: /run/secrets/runtime_broker_key
      ADMIRA_RUNTIME_IDLE_SECONDS: ${ADMIRA_RUNTIME_IDLE_SECONDS:-900}
      # Scheduled image work follows the same fail-closed readiness gate as
      # interactive Telegram turns.
      ADMIRA_CENTRAL_IMAGE_READY: "${ADMIRA_CENTRAL_IMAGE_READY:-false}"
    secrets:
      - scheduler_db_password
      - runtime_broker_key
    group_add:
      - "${ADMIRA_BROKER_GID:-19091}"
    volumes:
      - type: bind
        source: /run/admira-runtime-broker
        target: /run/admira-runtime-broker
        read_only: true
    networks:
      - control_private

networks:
  control_private:
    internal: true
  # First-run password setup must not be reachable from buyer workers or the
  # image broker. Only Postgres shares the internal operator network.
  operator_private:
    internal: true
  operator_provider_egress:
  telegram_egress:
  image_provider_egress:
  email_egress:

volumes:
  postgres_data:
  postgres_auth:
  redis_data:
  redis_auth:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_users_acl:
    file: ./secrets/redis_users.acl
  ingress_db_password:
    file: ./secrets/ingress_db_password.txt
  runtime_db_password:
    file: ./secrets/runtime_db_password.txt
  delivery_db_password:
    file: ./secrets/delivery_db_password.txt
  scheduler_db_password:
    file: ./secrets/scheduler_db_password.txt
  provisioner_db_password:
    file: ./secrets/provisioner_db_password.txt
  image_db_password:
    file: ./secrets/image_db_password.txt
  recovery_db_password:
    file: ./secrets/recovery_db_password.txt
  email_delivery_db_password:
    file: ./secrets/email_delivery_db_password.txt
  operator_db_password:
    file: ./secrets/operator_db_password.txt
  recovery_hmac_key:
    file: ./secrets/recovery_hmac_key.txt
  recovery_delivery_key:
    file: ./secrets/recovery_delivery_key.txt
  smtp_username:
    file: ./secrets/smtp_username.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  runtime_broker_key:
    file: ./secrets/runtime_broker_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
