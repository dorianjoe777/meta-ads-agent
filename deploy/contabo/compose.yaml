name: admira-control-plane

x-control-common: &control-common
  image: ${CONTROL_IMAGE:-admira-control-plane:r1}
  restart: unless-stopped
  init: true
  user: "${ADMIRA_SERVICE_UID:-1001}:${ADMIRA_SERVICE_GID:-1001}"
  read_only: true
  depends_on:
    postgres:
      condition: service_healthy
  environment: &control-environment
    ADMIRA_DB_HOST: postgres
    ADMIRA_DB_PORT: "5432"
    ADMIRA_DB_NAME: ${POSTGRES_DB:-admira_control}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  pids_limit: 96
  mem_limit: ${CONTROL_SERVICE_MEMORY_LIMIT:-256m}
  cpus: ${CONTROL_SERVICE_CPU_LIMIT:-0.50}
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    depends_on:
      postgres-secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admira_control}
      POSTGRES_USER: ${POSTGRES_USER:-admira_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - ingress_db_password
      - runtime_db_password
      - delivery_db_password
      - scheduler_db_password
      - provisioner_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_auth:/run/admira-db-secrets:ro
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - control_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: 1.0

  # File-backed Compose secrets keep host ownership/mode. Stage the service
  # role passwords into a PostgreSQL-owned private volume so the server-side
  # pg_read_file() calls never require making host secrets world-readable.
  postgres-secrets-init:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -d -m 0700 -o 999 -g 999 /postgres-auth;
        for secret_name in ingress_db_password runtime_db_password delivery_db_password scheduler_db_password provisioner_db_password;
        do install -m 0400 -o 999 -g 999 "/run/secrets/$${secret_name}" "/postgres-auth/$${secret_name}"; done
    secrets:
      - ingress_db_password
      - runtime_db_password
      - delivery_db_password
      - scheduler_db_password
      - provisioner_db_password
    volumes:
      - postgres_auth:/postgres-auth
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.1

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-bookworm}
    restart: unless-stopped
    user: "999:999"
    depends_on:
      redis-init:
        condition: service_completed_successfully
    command: ["redis-server", "--aclfile", "/run/redis-auth/redis_users.acl", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
      - redis_auth:/run/redis-auth:ro
    networks:
      - control_private
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^user default on >\\([^ ]*\\).*/\\1/p' /run/redis-auth/redis_users.acl)\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 128
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: 0.5

  # Docker secrets are mounted read-only as root-owned files.  The official
  # Redis image drops to uid 999, so stage the ACL into a private named volume
  # once, then let Redis read that volume without root or extra capabilities.
  redis-init:
    image: ${REDIS_IMAGE:-redis:7.4-bookworm}
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -d -m 0700 -o 999 -g 999 /redis-auth /data;
        install -m 0400 -o 999 -g 999 /run/secrets/redis_users_acl /redis-auth/redis_users.acl;
        chown -R 999:999 /data
    secrets:
      - redis_users_acl
    volumes:
      - redis_auth:/redis-auth
      - redis_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.1

  # Telegram network boundary. Only this process receives the shared token,
  # and it can only stage inbound media plus write to the durable inbox.
  telegram-poller:
    <<: *control-common
    profiles: ["buyers"]
    # Build the shared image exactly once. The remaining workers consume this
    # same tag and must not race while exporting parallel identical builds.
    build:
      context: .
      dockerfile: Control.Dockerfile
    command: ["poller"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_ingress_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/ingress_db_password
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ADMIRA_SPOOL_ROOT: /srv/admira-spool
    secrets:
      - ingress_db_password
      - telegram_bot_token
    group_add:
      - "${ADMIRA_SPOOL_GID:-19092}"
    volumes:
      - type: bind
        source: /srv/admira/shared/telegram-spool/inbound
        target: /srv/admira-spool/inbound
    networks:
      - control_private
      - telegram_egress

  # This process owns durable turn dispatch but has neither Telegram's token
  # nor Docker access. The authenticated host broker exposes only narrow
  # tenant lifecycle and turn operations over a Unix socket.
  runtime-worker:
    <<: *control-common
    profiles: ["buyers"]
    # Compose scales only this non-token-owning worker. Keep the default at
    # one; operators may raise it to eight after capacity testing.
    scale: ${RUNTIME_WORKER_REPLICAS:-1}
    command: ["runtime"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_runtime_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/runtime_db_password
      ADMIRA_BROKER_SOCKET: /run/admira-runtime-broker/broker.sock
      ADMIRA_BROKER_KEY_FILE: /run/secrets/runtime_broker_key
    secrets:
      - runtime_db_password
      - runtime_broker_key
    group_add:
      - "${ADMIRA_BROKER_GID:-19091}"
    volumes:
      - type: bind
        source: /run/admira-runtime-broker
        target: /run/admira-runtime-broker
        read_only: true
    networks:
      - control_private

  # Delivery is the only other token holder. It can read only the outbound
  # spool and cannot reach the runtime broker or any tenant directory.
  telegram-delivery:
    <<: *control-common
    profiles: ["buyers"]
    command: ["delivery"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_delivery_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/delivery_db_password
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ADMIRA_SPOOL_ROOT: /srv/admira-spool
    secrets:
      - delivery_db_password
      - telegram_bot_token
    group_add:
      - "${ADMIRA_SPOOL_GID:-19092}"
    volumes:
      - type: bind
        source: /srv/admira/shared/telegram-spool/outbound
        target: /srv/admira-spool/outbound
    networks:
      - control_private
      - telegram_egress

  scheduler-worker:
    <<: *control-common
    profiles: ["buyers"]
    command: ["scheduler"]
    environment:
      <<: *control-environment
      ADMIRA_DB_USER: admira_scheduler_login
      ADMIRA_DB_PASSWORD_FILE: /run/secrets/scheduler_db_password
      ADMIRA_BROKER_SOCKET: /run/admira-runtime-broker/broker.sock
      ADMIRA_BROKER_KEY_FILE: /run/secrets/runtime_broker_key
      ADMIRA_RUNTIME_IDLE_SECONDS: ${ADMIRA_RUNTIME_IDLE_SECONDS:-900}
    secrets:
      - scheduler_db_password
      - runtime_broker_key
    group_add:
      - "${ADMIRA_BROKER_GID:-19091}"
    volumes:
      - type: bind
        source: /run/admira-runtime-broker
        target: /run/admira-runtime-broker
        read_only: true
    networks:
      - control_private

networks:
  control_private:
    internal: true
  telegram_egress:

volumes:
  postgres_data:
  postgres_auth:
  redis_data:
  redis_auth:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_users_acl:
    file: ./secrets/redis_users.acl
  ingress_db_password:
    file: ./secrets/ingress_db_password.txt
  runtime_db_password:
    file: ./secrets/runtime_db_password.txt
  delivery_db_password:
    file: ./secrets/delivery_db_password.txt
  scheduler_db_password:
    file: ./secrets/scheduler_db_password.txt
  provisioner_db_password:
    file: ./secrets/provisioner_db_password.txt
  runtime_broker_key:
    file: ./secrets/runtime_broker_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
