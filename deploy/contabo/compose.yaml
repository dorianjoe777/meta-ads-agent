name: admira-control-plane

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admira_control}
      POSTGRES_USER: ${POSTGRES_USER:-admira_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - control_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: 1.0

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-bookworm}
    restart: unless-stopped
    user: "999:999"
    depends_on:
      redis-init:
        condition: service_completed_successfully
    command: ["redis-server", "--aclfile", "/run/redis-auth/redis_users.acl", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
      - redis_auth:/run/redis-auth:ro
    networks:
      - control_private
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^user default on >\\([^ ]*\\).*/\\1/p' /run/redis-auth/redis_users.acl)\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 128
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: 0.5

  # Docker secrets are mounted read-only as root-owned files.  The official
  # Redis image drops to uid 999, so stage the ACL into a private named volume
  # once, then let Redis read that volume without root or extra capabilities.
  redis-init:
    image: ${REDIS_IMAGE:-redis:7.4-bookworm}
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        install -d -m 0700 -o 999 -g 999 /redis-auth /data;
        install -m 0400 -o 999 -g 999 /run/secrets/redis_users_acl /redis-auth/redis_users.acl;
        chown -R 999:999 /data
    secrets:
      - redis_users_acl
    volumes:
      - redis_auth:/redis-auth
      - redis_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.1

networks:
  control_private:
    internal: true

volumes:
  postgres_data:
  redis_data:
  redis_auth:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_users_acl:
    file: ./secrets/redis_users.acl
